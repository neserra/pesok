<html lang="ru">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Песочница">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">

<title>Песочница — sand:box</title>
<style>
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --bar-bg: rgba(18, 20, 26, 0.94);
  --tile-sz: 54px;
}

* {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #000;
  color: #f1f5f9;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
  touch-action: none;
}

#app {
  width: 100%; height: 100dvh;
  display: flex; flex-direction: column;
  background: #000;
  position: relative;
  overflow: hidden;
}

/* CLEAN, COMPACT TOP BAR */
.topbar {
  padding: calc(7px + var(--sat)) 11px 7px;
  min-height: calc(55px + var(--sat));
  background: linear-gradient(180deg,#1a1d25 0%,#111319 100%);
  border-bottom:1px solid rgba(255,255,255,.12);
  display:flex; align-items:center; justify-content:space-between; gap:9px;
  z-index:20; flex-shrink:0; box-shadow:0 4px 16px rgba(0,0,0,.3);
}
.tb-brand { display:flex; align-items:center; gap:9px; min-width:0; }
.tb-logo { width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,#ffd54a,#f28b00);color:#17130a;font-size:20px;
  box-shadow:inset 0 1px 0 #fff8,0 2px 8px #f59e0b44; }
.tb-brand-copy { display:flex;flex-direction:column;gap:2px; }
.tb-brand-copy strong { font-size:12px;letter-spacing:1px;line-height:1.1;white-space:nowrap; }
.tb-brand-copy span { color:#8791a2;font-size:9px;font-weight:700;letter-spacing:.45px;white-space:nowrap; }
.tb-group { display:flex;align-items:center;gap:5px; }
.tb-btn {
  height:39px;min-width:39px;padding:0 8px;border-radius:11px;
  border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.07);color:#eef2f8;
  font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;transition:background .12s,transform .08s,border-color .12s;white-space:nowrap;
}
.tb-btn:active { transform:scale(.94); }
.tb-btn.active { background:#f59e0b;color:#111;border-color:#fbbf24; }
.tb-btn.heat-on { background:linear-gradient(135deg,#ef4444,#f59e0b);color:#fff;border-color:#fde047; }
.tb-btn .lbl { font-size:10px;font-weight:800; }
#btnPlay { background:linear-gradient(145deg,#f9b52c,#e88a00);color:#17130a;border-color:#ffce61; }
#btnMenu { font-size:21px;letter-spacing:1px; }
@media (max-width:370px) {
  .tb-brand-copy span { display:none; }
  .topbar { padding-left:7px;padding-right:7px;gap:5px; }
  .tb-group { gap:4px; }
  .tb-btn { min-width:36px;height:37px;padding:0 6px; }
}

/* CANVAS STAGE */
.stage-wrap {
  flex: 1; position: relative; min-height: 0;
  background: #02030a; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}

#simCanvas {
  display: block;
  width: 100%; height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  transform-origin: 0 0;
}

#overlayCanvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 5;
}

/* HUD PILLS OVER CANVAS */
.hud-pill {
  position: absolute; top: 8px; left: 8px; z-index: 12;
  padding: 5px 10px; border-radius: 99px;
  background: rgba(12, 14, 20, 0.82);
  border: 1px solid rgba(255,255,255,0.14);
  font-size: 12px; font-weight: 800; color: #fff;
  display: flex; align-items: center; gap: 7px;
  pointer-events: none; backdrop-filter: blur(4px);
}
.hud-swatch { width: 11px; height: 11px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.5); }
.hud-desc { font-size: 10.5px; color: #94a3b8; font-weight: 600; }

.hud-right {
  position: absolute; top: 8px; right: 8px; z-index: 12;
  display: flex; gap: 5px;
}
.mini-pill {
  padding: 4px 8px; border-radius: 8px;
  background: rgba(12, 14, 20, 0.78);
  border: 1px solid rgba(255,255,255,0.12);
  font-size: 10.5px; font-weight: 700; color: #cbd5e1;
  pointer-events: auto; cursor: pointer;
}

/* POPOVER PANEL (BRUSH / SCENES / SETTINGS) */
.popover {
  position: absolute; top: calc(62px + var(--sat)); left: 8px; right: 8px;
  max-width: 380px; margin: 0 auto; z-index: 40;
  background: rgba(20, 23, 31, 0.97);
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 16px; padding: 13px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.85);
  display: none; flex-direction: column; gap: 11px;
  max-height: calc(100dvh - 145px - var(--sat) - var(--sab)); overflow-y: auto;
  backdrop-filter: blur(10px);
}
.popover.open { display: flex; }
.pop-head { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 800; }
.pop-close {
  width: 28px; height: 28px; border-radius: 8px; border: none;
  background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; cursor: pointer;
}

.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.seg-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg-btn {
  padding: 8px 4px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06); color: #e2e8f0;
  font-size: 11.5px; font-weight: 700; cursor: pointer; text-align: center;
}
.seg-btn.active { background: #f59e0b; color: #111; border-color: #fbbf24; }

input[type=range] {
  width: 100%; accent-color: #f59e0b; height: 26px;
}

.scene-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.scene-btn {
  padding: 9px 10px; border-radius: 11px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  color: #fff; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 2px;
}
.scene-btn:active { background: rgba(245,158,11,0.22); }
.scene-btn strong { font-size: 12px; }
.scene-btn span { font-size: 10px; color: #94a3b8; }


.menu-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px; }
.menu-action { min-height:61px;padding:8px 4px;border-radius:12px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.055);color:#f1f5f9;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;font-size:19px;cursor:pointer; }
.menu-action span { font-size:10px;font-weight:750;color:#cbd5e1; }
.menu-action.active { background:rgba(245,158,11,.2);border-color:rgba(245,158,11,.55); }
.menu-action.danger { color:#fca5a5; }
.menu-action:active { transform:scale(.97); }

/* CATEGORY STRIP */
.cat-strip {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 6px 4px;
  background: #12141a;
  border-top: 1px solid rgba(255,255,255,0.1);
  overflow-x: auto; scrollbar-width: none;
  flex-shrink: 0;
}
.cat-strip::-webkit-scrollbar { display: none; }
.cat-chip {
  padding: 4px 9px; border-radius: 7px; border: none;
  background: rgba(255,255,255,0.07); color: #cbd5e1;
  font-size: 11px; font-weight: 800; white-space: nowrap; cursor: pointer;
}
.cat-chip.active { background: #f59e0b; color: #111; }

/* ICONIC SMELLYMOO 2-ROW SQUARE TILE PALETTE */
.palette-wrap {
  background: #000;
  border-top: 2px solid #000;
  padding-bottom: var(--sab);
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  flex-shrink: 0;
  touch-action: pan-x;
}
.palette-wrap::-webkit-scrollbar { display: none; }

.palette-grid {
  display: grid;
  grid-template-rows: repeat(2, var(--tile-sz));
  grid-auto-flow: column;
  grid-auto-columns: var(--tile-sz);
  gap: 0;
  width: max-content;
}

.el-tile {
  width: var(--tile-sz); height: var(--tile-sz);
  border: 1.5px solid #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; cursor: pointer;
  padding: 2px;
  transition: filter .1s;
}
.el-tile:active { filter: brightness(1.18); }
.el-tile svg { width: 32px; height: 32px; display: block; pointer-events: none; }
.el-tile .t-name {
  font-size: 8.5px; font-weight: 900; color: #111;
  line-height: 1; margin-top: 1px; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  letter-spacing: -0.2px;
}
.el-tile.dark-txt .t-name { color: #fff; text-shadow: 0 1px 2px #000; }
.el-tile.selected {
  box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 5px #000;
  z-index: 3;
}

/* CONFIRM DIALOG */
.toast {
  position: fixed; bottom: calc(var(--tile-sz) * 2 + 46px + var(--sab));
  left: 50%; transform: translateX(-50%) translateY(10px);
  background: rgba(15,18,26,0.95); color: #fff;
  border: 1px solid rgba(255,255,255,0.2);
  padding: 7px 14px; border-radius: 99px;
  font-size: 12px; font-weight: 800;
  opacity: 0; pointer-events: none; transition: all .2s; z-index: 60;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-width: 600px) {
  :root { --tile-sz: 58px; }
}
</style>
</head>
<body>
<div id="app">
  <!-- TOP CONTROL BAR -->
  <header class="topbar">
    <div class="tb-brand"><div class="tb-logo">✺</div><div class="tb-brand-copy"><strong>ПЕСОЧНИЦА</strong><span>СИМУЛЯТОР МАТЕРИАЛОВ</span></div></div>
    <div class="tb-group">
      <button class="tb-btn" id="btnPlay" title="Пауза / Продолжить">⏸</button>
      <button class="tb-btn" id="btnUndo" title="Отменить действие">↶</button>
      <button class="tb-btn" id="btnMenu" title="Дополнительные инструменты">···</button>
    </div>
  </header>

  <!-- EXTRA CONTROLS: kept out of the main bar to reduce clutter -->
  <div class="popover" id="popMenu">

      <button class="menu-action" id="btnLine" title="Рисование прямой линией">╱<span>Линия</span></button>

      <button class="menu-action" id="btnTilt" title="Разрешить датчик наклона">📱<span>Включить наклон</span></button>
      <button class="menu-action" id="btnMix" title="Смешивать любые материалы">⚗️<span>Смешивание: выкл</span></button>
      <button class="menu-action" id="btnScenes" title="Миры и сохранения">🌍<span>Миры и слоты</span></button>
      <button class="menu-action" id="btnSound" title="Звуковые эффекты">🔊<span>Звук: вкл</span></button>
      <button class="menu-action danger" id="btnClear" title="Очистить холст">⌫<span>Очистить</span></button>
    </div>
    <div style="font-size:10px;color:#8290a3;text-align:center;line-height:1.5">Смесь: нарисуй A, выбери B и проведи по A.<br>Очистка — двойным нажатием.</div>
  </div>

  <!-- SCENES & SAVE/LOAD POPOVER -->
  <div class="popover" id="popScenes">
    <div class="pop-head">
      <span>💾 Готовые сцены и сохранения</span>
      <button class="pop-close" data-close="popScenes">✕</button>
    </div>
    <div style="font-size:11px;color:#94a3b8;font-weight:700;text-transform:uppercase">Готовые миры</div>
    <div class="scene-grid">
      <button class="scene-btn" data-preset="classic"><strong>🧱 Классика sand:box</strong><span>4 дозатора, вёдра, огонь</span></button>
      <button class="scene-btn" data-preset="volcano"><strong>🌋 Вулкан и озеро</strong><span>Лава, вода, пар, камень</span></button>
      <button class="scene-btn" data-preset="bomb"><strong>💣 Детонатор C4</strong><span>Батарейка, провод, TNT</span></button>
      <button class="scene-btn" data-preset="lab"><strong>🧪 Кислотная лаба</strong><span>Стекло, металл, кислота</span></button>
    </div>
    <div style="font-size:11px;color:#94a3b8;font-weight:700;text-transform:uppercase;margin-top:2px">Твои слоты (в памяти iPhone)</div>
    <div id="saveSlots" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>

  <!-- CANVAS AREA -->
  <div class="stage-wrap" id="stageWrap">
    <canvas id="simCanvas"></canvas>
    <canvas id="overlayCanvas"></canvas>

    <div class="hud-pill" id="hudEl">
      <span class="hud-swatch" id="hudSwatch"></span>
      <span id="hudName">Песок</span>
      <span class="hud-desc" id="hudDesc">Сыпется, плавится в стекло</span>
    </div>

    <div class="hud-right">
      <div class="mini-pill" id="btnResetZoom" style="display:none">🔍 100%</div>
      <div class="mini-pill" id="hudTemp">22°C</div>
    </div>
  </div>

  <!-- CATEGORY FILTER STRIP -->
  <div class="cat-strip" id="catStrip">
    <button class="cat-chip active" data-cat="all">Все (84)</button>
    <button class="cat-chip" data-cat="tools">Инструм.</button>
    <button class="cat-chip" data-cat="fire">Огонь</button>
    <button class="cat-chip" data-cat="powder">Сыпучие</button>
    <button class="cat-chip" data-cat="liquid">Жидкости</button>
    <button class="cat-chip" data-cat="nature">Природа</button>
    <button class="cat-chip" data-cat="solid">Стройка</button>
    <button class="cat-chip" data-cat="mech">Механизмы</button>
    <button class="cat-chip" data-cat="new">Новое</button>
    <button class="cat-chip" data-cat="weather">Погода</button>
    <button class="cat-chip" data-cat="alchemy">Алхимия</button>
  </div>

  <!-- ICONIC 2-ROW COLORED SQUARE TILE PALETTE -->
  <div class="palette-wrap" id="paletteWrap">
    <div class="palette-grid" id="paletteGrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* ==================== ELEMENT IDS ==================== */
const E = {
  EMPTY:0,
  SAND:1, WATER:2, OIL:3, SALT:4, SNOW:5, FIRE:6, LAVA:7, BRICK:8, STONE:9,
  METAL:10, WOOD:11, GLASS:12, PLANT:13, SEED:14, GUNPOWDER:15, TNT:16, C4:17,
  ACID:18, GAS:19, STEAM:20, SMOKE:21, ICE:22, CONCRETE:23, DIRT:24, SAWDUST:25,
  ASH:26, MERCURY:27, NITROGEN:28, GASOLINE:29, NITRO:30, THERMITE:31, URANIUM:32,
  PLASMA:33, FUSE:34, SULFUR:35, TOXIC:36, ALGAE:37, VIRUS:38, ANT:39, FISH:40,
  SPONGE:41, VOID:42, CLONE:43, BATTERY:44, WIRE:45, HEATER:46, COOLER:47,
  LED:48, FAN:49, VOLCANO:50, FIREWORK:51, FOAM:52, SALTWATER:53,
  CLOUD:54, RAIN:55, OXYGEN:56, MOSS:57, WAX:58, RUBBER:59, CERAMIC:60, OBSIDIAN:61, CORAL:62, HONEY:63,
  // Pseudo-tools (>= 100)
  MUD:64, COPPER:65, COAL:66, CHARCOAL:67, BUBBLE:68, SALTPETER:69, STEEL:70, MAGNET:71, CLAY:72, GRAVEL:73,
  GOLD:74, DIAMOND:75, RUST:76, LYE:77, SOAP:78, SYRUP:79, ALCOHOL:80, CUPRITES:81, MIX:82,
  TOOL_HEAT:101, TOOL_COOL:102, TOOL_SPARK:103
};

/* ==================== ELEMENT METADATA & TILE PALETTE ==================== */
// Colors: packed ABGR helper for ImageData Uint32Array (little-endian)
function packRGBA(r, g, b, a=255) {
  return ((a & 255) << 24) | ((b & 255) << 16) | ((g & 255) << 8) | (r & 255);
}

// Element physics tables
const DENSITY = new Int16Array(96);
const FLAMMABLE = new Uint8Array(96); // 0=no, higher=easier to burn
const CONDUCTIVE = new Uint8Array(96);
const SOLID = new Uint8Array(96);
const LIQUID = new Uint8Array(96);
const POWDER = new Uint8Array(96);
const GAS_T = new Uint8Array(96);

function regPhys(id, type, density, flam=0, cond=0) {
  DENSITY[id] = density;
  FLAMMABLE[id] = flam;
  CONDUCTIVE[id] = cond;
  if (type === 'S') SOLID[id] = 1;
  else if (type === 'L') LIQUID[id] = 1;
  else if (type === 'P') POWDER[id] = 1;
  else if (type === 'G') GAS_T[id] = 1;
}

regPhys(E.EMPTY,     'G', 0);
regPhys(E.FIRE,      'G', -10);
regPhys(E.PLASMA,    'G', -14);
regPhys(E.GAS,       'G', -8, 95);
regPhys(E.STEAM,     'G', -6);
regPhys(E.SMOKE,     'G', -5);
regPhys(E.TOXIC,     'G', -4);
regPhys(E.FIREWORK,  'G', -12);

regPhys(E.FOAM,      'L', 8);
regPhys(E.GASOLINE,  'L', 11, 95);
regPhys(E.OIL,       'L', 13, 65);
regPhys(E.NITRO,     'L', 16, 100);
regPhys(E.NITROGEN,  'L', 18);
regPhys(E.WATER,     'L', 22);
regPhys(E.SALTWATER, 'L', 25, 0, 1);
regPhys(E.ACID,      'L', 26);
regPhys(E.LAVA,      'L', 42);
regPhys(E.MERCURY,   'L', 96, 0, 1);

regPhys(E.SAWDUST,   'P', 15, 70);
regPhys(E.SNOW,      'P', 19);
regPhys(E.ASH,       'P', 28);
regPhys(E.SEED,      'P', 40, 35);
regPhys(E.SALT,      'P', 46);
regPhys(E.SULFUR,    'P', 48, 80);
regPhys(E.GUNPOWDER, 'P', 50, 95);
regPhys(E.SAND,      'P', 55);
regPhys(E.DIRT,      'P', 56);
regPhys(E.CONCRETE,  'P', 62);
regPhys(E.THERMITE,  'P', 68, 55);
regPhys(E.URANIUM,   'P', 85, 0, 1);

regPhys(E.BRICK,     'S', 100);
regPhys(E.STONE,     'S', 100);
regPhys(E.METAL,     'S', 100, 0, 1);
regPhys(E.GLASS,     'S', 100);
regPhys(E.WOOD,      'S', 100, 22);
regPhys(E.ICE,       'S', 100);
regPhys(E.PLANT,     'S', 100, 50);
regPhys(E.ALGAE,     'S', 100, 30);
regPhys(E.TNT,       'S', 100, 90);
regPhys(E.C4,        'S', 100, 60, 1);
regPhys(E.FUSE,      'S', 100, 88);
regPhys(E.VIRUS,     'S', 100, 60);
regPhys(E.SPONGE,    'S', 100, 35);
regPhys(E.VOID,      'S', 100);
regPhys(E.CLONE,     'S', 100);
regPhys(E.BATTERY,   'S', 100, 0, 1);
regPhys(E.WIRE,      'S', 100, 0, 1);
regPhys(E.HEATER,    'S', 100, 0, 1);
regPhys(E.COOLER,    'S', 100, 0, 1);
regPhys(E.LED,       'S', 100, 0, 1);
regPhys(E.FAN,       'S', 100, 0, 1);
regPhys(E.VOLCANO,   'S', 100);
regPhys(E.ANT,       'P', 45, 70);
regPhys(E.FISH,      'L', 23, 50);
regPhys(E.CLOUD,     'G', -7);
regPhys(E.RAIN,      'L', 24);
regPhys(E.OXYGEN,    'G', -9);
regPhys(E.MOSS,      'S', 90, 18);
regPhys(E.WAX,       'S', 65, 45);
regPhys(E.RUBBER,    'S', 100, 82);
regPhys(E.CERAMIC,   'S', 100);

const PALETTE_MAP = {};
PALETTE.forEach(p => PALETTE_MAP[p.id] = p);
function mixedPixel(i) {
  const ca=(PALETTE_MAP[mixA[i]]||PALETTE_MAP[E.METAL]).sw;
  const cb=(PALETTE_MAP[mixB[i]]||PALETTE_MAP[E.STONE]).sw;
  const ar=parseInt(ca.slice(1,3),16)||0, ag=parseInt(ca.slice(3,5),16)||0, ab=parseInt(ca.slice(5,7),16)||0;
  const br=parseInt(cb.slice(1,3),16)||0, bg=parseInt(cb.slice(3,5),16)||0, bb=parseInt(cb.slice(5,7),16)||0;
  const r=mixRatio[i]/255, grain=((shade[i]&15)-7);
  return packRGBA((ar*r+br*(1-r)+grain)|0,(ag*r+bg*(1-r)+grain)|0,(ab*r+bb*(1-r)+grain)|0);
}

/* ==================== AUDIO ENGINE ==================== */
const SFX = {
  ctx: null, on: true, lastPlay: 0,
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
  },
  boom(size=1) {
    if (!this.on) return;
    const now = performance.now();
    if (now - this.lastPlay < 90) return;
    this.lastPlay = now;
    this.unlock();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(110 / Math.max(0.7, size * 0.5), t);
    o.frequency.exponentialRampToValueAtTime(24, t + 0.25 + size * 0.08);
    g.gain.setValueAtTime(Math.min(0.22, 0.1 + size * 0.05), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28 + size * 0.1);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + 0.42);
  },
  zap() {
    if (!this.on) return;
    const now = performance.now();
    if (now - this.lastPlay < 70) return;
    this.lastPlay = now;
    this.unlock();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(980, t);
    o.frequency.exponentialRampToValueAtTime(240, t + 0.06);
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.065);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + 0.07);
  }
};

        continue;
      } else if (c === E.GUNPOWDER) {
        if (t > 210) { explode(x, y, 8, 0.9); continue; }
      } else if (c === E.NITRO) {
        if (t > 110) { explode(x, y, 14, 1.3); continue; }
      } else if (c === E.THERMITE) {
        if (t > 450) {
          temp[i] = 2800;
          heatNeighbors(x, y, i, 2400);
          if (y < H - 1 && (grid[i+W] === E.METAL || grid[i+W] === E.BRICK || grid[i+W] === E.STONE)) {
            if (Math.random() < 0.35) setCell(i+W, E.LAVA);
          }
          if (Math.random() < 0.07) setCell(i, E.FIRE);
        }
      } else if (c === E.URANIUM) {
        // Count uranium neighbors -> critical mass = NUKE!
        let uCnt = 0;
        if (x>0 && grid[i-1]===E.URANIUM) uCnt++;
        if (x<W-1 && grid[i+1]===E.URANIUM) uCnt++;
        if (y>0 && grid[i-W]===E.URANIUM) uCnt++;
        if (y<H-1 && grid[i+W]===E.URANIUM) uCnt++;
        temp[i] += 1.4 + uCnt * 4.5;
        if (temp[i] > 1600) { explode(x, y, 32, 2.8); continue; }
      } else if (c === E.OIL || c === E.GASOLINE) {
        const ign = c === E.GASOLINE ? 140 : 280;
        if (t > ign) {
          setCell(i, E.FIRE);
          temp[i] = 850;
          if (y > 0 && grid[i-W] === E.EMPTY && Math.random() < 0.5) setCell(i-W, E.FIRE);
          continue;
        }
        if (c === E.GASOLINE && y > 0 && grid[i-W] === E.EMPTY && Math.random() < 0.008) {
          setCell(i-W, E.GAS);
        }
      } else if (c === E.SULFUR) {
        if (t > 220) {
          setCell(i, Math.random() < 0.5 ? E.FIRE : E.TOXIC);
          temp[i] = 750;
          continue;
        }
      } else if (c === E.SAWDUST) {
        if (t > 230) { setCell(i, E.FIRE); temp[i] = 700; continue; }
      } else if (c === E.LAVA) {
        temp[i] = Math.max(t - 0.12, 1050);
        if (t < 520) { setCell(i, E.STONE); continue; }
        // Interact with water -> stone + steam
        if (touchReplace(x, y, i, E.WATER, E.STEAM) || touchReplace(x, y, i, E.SALTWATER, E.STEAM) || touchReplace(x, y, i, E.ICE, E.STEAM)) {
          setCell(i, E.STONE); temp[i] = 300; continue;
        }
        if (y > 0 && grid[i-W] === E.EMPTY && Math.random() < 0.025) setCell(i-W, E.FIRE);
      } else if (c === E.NITROGEN) {
        temp[i] = -196;
        heatNeighbors(x, y, i, -180);
        if (Math.random() < 0.04) { setCell(i, E.STEAM); temp[i] = -30; continue; }
      } else if (c === E.ACID) {
        // Corrodes neighbors except Glass, Acid, Empty, Void, Clone
        const ns = [y<H-1?i+W:-1, x>0?i-1:-1, x<W-1?i+1:-1, y>0?i-W:-1];
        for (let k = 0; k < 4; k++) {
          const ni = ns[k];
          if (ni < 0) continue;
          const nc = grid[ni];
          if (nc !== E.EMPTY && nc !== E.ACID && nc !== E.GLASS && nc !== E.VOID && nc !== E.CLONE && nc !== E.TOXIC) {
            if (Math.random() < (nc === E.METAL || nc === E.STONE || nc === E.BRICK ? 0.08 : 0.28)) {
              setCell(ni, Math.random() < 0.3 ? E.TOXIC : E.EMPTY);
              if (Math.random() < 0.55) { setCell(i, E.EMPTY); break; }
            }
          }
        }
        if (grid[i] !== E.ACID) continue;
      } else if (c === E.SALT) {
        // Dissolve in water -> saltwater, melt ice
        if (touchReplace(x, y, i, E.WATER, E.SALTWATER)) { setCell(i, E.EMPTY); continue; }
        if (touchReplace(x, y, i, E.ICE, E.SALTWATER)) { setCell(i, E.EMPTY); continue; }
      } else if (c === E.CONCRETE) {
        if (hasNeighbor(x, y, i, E.WATER)) {
          if (Math.random() < 0.14) { setCell(i, E.STONE); continue; }
        }
      } else if (c === E.SEED) {
        if (t > 280) { setCell(i, E.FIRE); continue; }
        if (hasNeighbor(x, y, i, E.WATER) || hasNeighbor(x, y, i, E.DIRT)) {
          if (Math.random() < 0.15) { setCell(i, E.PLANT); continue; }
        }
      } else if (c === E.PLANT) {
        if (t > 240) { setCell(i, E.FIRE); temp[i] = 650; continue; }
        if (hasNeighbor(x, y, i, E.TOXIC)) { setCell(i, E.ASH); continue; }
        // Drink adjacent water and grow upwards/sideways!
        if (touchReplace(x, y, i, E.WATER, E.PLANT)) {
          if (y > 0 && grid[i-W] === E.EMPTY && Math.random() < 0.65) setCell(i-W, E.PLANT);
        } else if (y > 1 && Math.random() < 0.012 && (hasNeighbor(x, y, i, E.DIRT) || hasNeighbor(x, y, i, E.WATER))) {
          const dx = randDir3();
          const nx = x + dx;
          if (nx >= 0 && nx < W && grid[(y-1)*W + nx] === E.EMPTY) setCell((y-1)*W + nx, E.PLANT);
        }
        continue;
      } else if (c === E.ALGAE) {
        if (t > 220) { setCell(i, E.FIRE); continue; }
        if (Math.random() < 0.025) {
          const dx = randDir3(), dy = Math.random() < 0.7 ? -1 : 0;
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < W && ny >= 0 && ny < H && grid[ny*W+nx] === E.WATER) {
            setCell(ny*W+nx, E.ALGAE);
          }
        }
        continue;
      } else if (c === E.VIRUS) {
        if (t > 180) { setCell(i, E.SMOKE); continue; }
        if (Math.random() < 0.06) {
          const ns = [x>0?i-1:-1, x<W-1?i+1:-1, y>0?i-W:-1, y<H-1?i+W:-1];
          const ni = ns[(Math.random() * 4) | 0];
          if (ni >= 0) {
            const nc = grid[ni];
            if (nc !== E.EMPTY && nc !== E.VIRUS && nc !== E.VOID && nc !== E.FIRE && nc !== E.LAVA && nc !== E.ACID && nc !== E.GLASS) {
              setCell(ni, E.VIRUS);
            }
          }
        }
        continue;
      } else if (c === E.FOAM) {
        if (touchReplace(x, y, i, E.FIRE, E.STEAM)) { setCell(i, E.EMPTY); continue; }
      } else if (c === E.ANT) {
        if (t > 90 || hasNeighbor(x, y, i, E.ACID) || hasNeighbor(x, y, i, E.TOXIC)) { setCell(i, E.ASH); continue; }
        stepAnt(x, y, i);
        continue;
      } else if (c === E.FISH) {
        if (t > 75 || hasNeighbor(x, y, i, E.ACID) || hasNeighbor(x, y, i, E.TOXIC)) { setCell(i, E.ASH); continue; }
        stepFish(x, y, i);
        continue;
      }

      // ---------- GASES & FIRE ----------
      if (isGasAt(c,i)) {
        if (c === E.BUBBLE) {
          if (hasNeighbor(x,y,i,E.FIRE) || hasNeighbor(x,y,i,E.LAVA) || meta[i]-- <= 0) { setCell(i,E.EMPTY); continue; }
        }
        if (c === E.CLOUD) {
          if ((frame & 7) === 0 && x > 0 && grid[i-1] === E.EMPTY && Math.random() < 0.25) swapCells(i,i-1);
          if (Math.random() < 0.0008 && y < H-2 && grid[i+W] === E.EMPTY) setCell(i+W,E.RAIN);
          continue;
        }
        if (c === E.OXYGEN) {
          if (hasNeighbor(x,y,i,E.FIRE) || hasNeighbor(x,y,i,E.PLASMA)) { setCell(i,E.EMPTY); continue; }
        }
        if (c === E.FIRE || c === E.PLASMA) {
          temp[i] = c === E.PLASMA ? 4500 : 720;
          heatNeighbors(x, y, i, c === E.PLASMA ? 2200 : 380);
          if (c === E.FIRE && hasNeighbor(x,y,i,E.OXYGEN)) { temp[i] += 120; if (meta[i] < 55) meta[i] += 2; }
          // Extinguish in water
          if (touchReplace(x, y, i, E.WATER, E.STEAM)) { setCell(i, E.SMOKE); continue; }
          if (meta[i] <= 1) {
            setCell(i, c === E.FIRE && Math.random() < 0.22 ? E.SMOKE : E.EMPTY);
            continue;
          }
          meta[i]--;
        } else if (c === E.FIREWORK) {
          meta[i]--;
          if (meta[i] <= 0 || y <= 3 || (y > 0 && grid[i-W] !== E.EMPTY)) {
            explodeFirework(x, y);
            continue;
          }
          if (y < H - 1 && grid[i+W] === E.EMPTY) setCell(i+W, E.FIRE, 8);
          if (y > 0 && grid[i-W] === E.EMPTY) swapCells(i, i-W);
          continue;
        } else if (c === E.GAS) {
          if (t > 180 || elec[i] > 0) { explode(x, y, 10, 1.0); continue; }
        } else if (c === E.STEAM) {
          meta[i]--;
          if (meta[i] <= 0 || t < 50) {
            setCell(i, Math.random() < 0.65 ? E.WATER : E.EMPTY);
            continue;
          }
        } else if (c === E.SMOKE || c === E.TOXIC) {
          meta[i]--;
          if (meta[i] <= 0) { setCell(i, E.EMPTY); continue; }
        }

        // Gas rising movement
        const rx = -gvx, ry = -gvy; // gases rise opposite to gravity
        const sideX = gvx ? 0 : 1, sideY = gvx ? 1 : 0;
        const drift = randDir3();
        const tx = x + rx + sideX * drift, ty = y + ry + sideY * drift;
        if (tx >= 0 && tx < W && ty >= 0 && ty < H) {
          const ti = ty * W + tx, tc = grid[ti];
          if (tc === E.EMPTY || (isLiquidAt(tc,ti) && Math.random() < 0.35)) { swapCells(i,ti); continue; }
        }
        const side = Math.random() < 0.5 ? -1 : 1;
        const sx = x + sideX * side, sy = y + sideY * side;
        if (sx >= 0 && sx < W && sy >= 0 && sy < H && grid[sy*W+sx] === E.EMPTY) swapCells(i,sy*W+sx);
        continue;
      }

      if (gDir === 0) continue; // Zero gravity freezes powders & liquids in place

      // ---------- POWDERS ----------
      if (isPowderAt(c,i)) {
        if (c === E.SNOW && (frame & 1) === 0) continue;
        const perpX = gvx ? 0 : 1, perpY = gvx ? 1 : 0;
        const nx = x + gvx, ny = y + gvy;
        if (horizontal && Math.random()<0.09) {
          const rollY=y+(Math.random()<0.5?-1:1);
          if(rollY>=0&&rollY<H&&grid[rollY*W+x]===E.EMPTY){swapCells(i,rollY*W+x);continue;}
        }
        if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
          const below = ny * W + nx, bc = grid[below];
          const shearSkip = horizontal && Math.random() < 0.38;
          if (!shearSkip && (bc === E.EMPTY || (densityAt(c,i) > densityAt(bc,below) && (isLiquidAt(bc,below) || isGasAt(bc,below))))) { swapCells(i, below); continue; }
          const sign = Math.random() < 0.5 ? -1 : 1;
          for (const side of [sign,-sign]) {
            const tx = nx + perpX * side, ty = ny + perpY * side;
            if (tx < 0 || tx >= W || ty < 0 || ty >= H) continue;
            const bi = ty * W + tx, tc = grid[bi];
            if (tc === E.EMPTY || (densityAt(c,i) > densityAt(tc,bi) && (isLiquidAt(tc,bi) || isGasAt(tc,bi)))) { swapCells(i,bi); break; }
          }
        }
        continue;
      }

      // ---------- LIQUIDS ----------
      if (isLiquidAt(c,i)) {
        if ((c === E.HONEY || c === E.MUD || c === E.SYRUP) && (frame & (c === E.HONEY || c === E.SYRUP ? 3 : 1)) !== 0) continue;
        const perpX = gvx ? 0 : 1, perpY = gvx ? 1 : 0;
        const nx = x + gvx, ny = y + gvy;
        if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
          const below = ny * W + nx, bc = grid[below];
          if (bc === E.EMPTY || (densityAt(c,i) > densityAt(bc,below) && !isSolidAt(bc,below) && !isPowderAt(bc,below)) || (c === E.MERCURY && isPowderAt(bc,below))) { swapCells(i,below); continue; }
          const sign = Math.random() < 0.5 ? -1 : 1;
          for (const side of [sign,-sign]) {
            const tx = nx + perpX * side, ty = ny + perpY * side;
            if (tx < 0 || tx >= W || ty < 0 || ty >= H) continue;
            const bi = ty * W + tx, tc = grid[bi];
            if (tc === E.EMPTY || (densityAt(c,i) > densityAt(tc,bi) && !isSolidAt(tc,bi) && !isPowderAt(tc,bi))) { swapCells(i,bi); break; }
          }
        }
        const disp = c === E.LAVA || c === E.HONEY || c === E.MUD || c === E.SYRUP ? 1 : (c === E.OIL ? 3 : 5);
        const dir = Math.random() < 0.5 ? -1 : 1;
        for (let step = 1; step <= disp; step++) {
          const tx = x + perpX * dir * step, ty = y + perpY * dir * step;
          if (tx < 0 || tx >= W || ty < 0 || ty >= H) break;
          const ni = ty * W + tx, nc = grid[ni];
          if (nc === E.EMPTY) { swapCells(i,ni); break; }
          if (isLiquidAt(nc,ni) && densityAt(c,i) > densityAt(nc,ni) && Math.random() < 0.35) { swapCells(i,ni); break; }
          if (isSolidAt(nc,ni) || isPowderAt(nc,ni)) break;
        }
      }
    }
  }
}

function randDir3() { return ((Math.random() * 3) | 0) - 1; }

function spreadElec(ni) {
  const nc = grid[ni];
  if (conductiveAt(ni) && elec[ni] === 0) {
    elec[ni] = 1;
  } else if (FLAMMABLE[nc] >= 80) {
    temp[ni] = Math.max(temp[ni], 500);
  }
}

function heatNeighbors(x, y, i, targetT) {
  if (x > 0)     temp[i-1] += (targetT - temp[i-1]) * 0.25;
  if (x < W - 1) temp[i+1] += (targetT - temp[i+1]) * 0.25;
  if (y > 0)     temp[i-W] += (targetT - temp[i-W]) * 0.25;
  if (y < H - 1) temp[i+W] += (targetT - temp[i+W]) * 0.25;
}

function hasNeighbor(x, y, i, targetId) {
  return (x > 0 && grid[i-1] === targetId) ||
         (x < W-1 && grid[i+1] === targetId) ||
         (y > 0 && grid[i-W] === targetId) ||
         (y < H-1 && grid[i+W] === targetId);
}

function touchReplace(x, y, i, targetId, replaceWith) {
  if (x > 0 && grid[i-1] === targetId) { setCell(i-1, replaceWith); return true; }
  if (x < W-1 && grid[i+1] === targetId) { setCell(i+1, replaceWith); return true; }
  if (y > 0 && grid[i-W] === targetId) { setCell(i-W, replaceWith); return true; }
  if (y < H-1 && grid[i+W] === targetId) { setCell(i+W, replaceWith); return true; }
  return false;
}

function explodeFirework(cx, cy) {
  SFX.boom(0.7);
  setCell(cy * W + cx, E.EMPTY);
  const hue = (Math.random() * 255) | 0;
  for (let a = 0; a < 28; a++) {
    const ang = (a / 28) * Math.PI * 2 + Math.random() * 0.2;
    const rad = 3 + Math.random() * 9;
    const nx = Math.round(cx + Math.cos(ang) * rad);
    const ny = Math.round(cy + Math.sin(ang) * rad);
    if (nx > 1 && nx < W - 1 && ny > 1 && ny < H - 1 && grid[ny*W+nx] === E.EMPTY) {
      setCell(ny*W+nx, E.PLASMA, 18 + ((Math.random() * 18) | 0));
      shade[ny*W+nx] = (hue + ((Math.random() * 40) | 0)) & 255;
      stamp[ny*W+nx] = stepId;
    }
  }
}

function stepAnt(x, y, i) {
  if (y < H - 1 && grid[i + W] === E.EMPTY) { swapCells(i, i + W); return; }
  let dir = meta[i] === 1 ? 1 : -1;
  if (Math.random() < 0.04) { dir = -dir; meta[i] = dir === 1 ? 1 : 0; }
  const nx = x + dir;
  if (nx >= 0 && nx < W) {
    const ni = y * W + nx;
    const nc = grid[ni];
    if (nc === E.EMPTY) { swapCells(i, ni); return; }
    // Climb 1px step
    if (y > 0 && grid[ni - W] === E.EMPTY) { swapCells(i, ni - W); return; }
    // Dig through dirt / sand / wood / plant
    if ((nc === E.DIRT || nc === E.SAND || nc === E.WOOD || nc === E.PLANT) && Math.random() < 0.2) {
      setCell(ni, E.EMPTY); swapCells(i, ni); return;
    }
  }
  meta[i] = dir === 1 ? 0 : 1; // turn around
}

function stepFish(x, y, i) {
  let dir = meta[i] === 1 ? 1 : -1;
  if (Math.random() < 0.04) { dir = -dir; meta[i] = dir === 1 ? 1 : 0; }
  const dy = Math.random() < 0.35 ? (Math.random() < 0.5 ? -1 : 1) : 0;
  const nx = x + dir, ny = y + dy;
  if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
    const ni = ny * W + nx;
    if (grid[ni] === E.WATER || grid[ni] === E.SALTWATER) {
      swapCells(i, ni); return;
    }
  }
  // Fall if in air
  if (y < H - 1 && grid[i + W] === E.EMPTY) { swapCells(i, i + W); return; }
  meta[i] = dir === 1 ? 0 : 1;
}

/* ==================== RENDERING (TEXTURED PIXELS + HEAT VISION) ==================== */
function renderSim() {
  if (heatVision) {
    renderHeatVision();
    ctx.putImageData(imgData, 0, 0);
    return;
  }

  for (let y = 0; y < H; y++) {
    const row = y * W;
    for (let x = 0; x < W; x++) {
      const i = row + x;
      const c = grid[i];
      if (c === E.EMPTY) { buf32[i] = bgPacked; continue; }

      if (c === E.MIX) { buf32[i] = mixedPixel(i); continue; }

      // Active electric spark flash!
      if (elec[i] === 1) { buf32[i] = packRGBA(255, 250, 120); continue; }

      const s = shade[i]; // 0..255
      const v = (s & 31) - 15; // -15..+16
      let col;

      switch (c) {
        case E.SAND:
          col = packRGBA(255, Math.min(255, 206 + v * 2), Math.max(0, 18 + (s & 31)));
          break;
        case E.WATER: {
          const sh = ((s + frame * 3) & 31);
          col = packRGBA(0, 75 + sh * 2, 235 + (sh >> 1));
          break;
        }
        case E.SALTWATER: {
          const sh = ((s + frame * 2) & 31);
          col = packRGBA(45 + sh, 125 + sh * 2, 240);
          break;
        }
        case E.OIL:
          col = packRGBA(158 + (v >> 1), 130 + (v >> 1), 14);
          break;
        case E.GASOLINE:
          col = packRGBA(218 + v, 165 + v, 35);
          break;
        case E.SALT:
          col = packRGBA(240 + (s & 15), 240 + (s & 15), 244 + (s & 11));
          break;
        case E.SNOW:
          col = packRGBA(225 + (s & 28), 240 + (s & 15), 255);
          break;
        case E.ICE: {
          const streak = ((x + y) & 7) === 0 ? 35 : 0;
          col = packRGBA(120 + streak, 210 + (v >> 1) + streak, 255);
          break;
        }
        case E.BRICK: {
          // Authentic SmellyMoo pixel brick wall with light grey mortar!
          const off = ((y >> 2) & 1) ? 4 : 0;
          if ((y & 3) === 0 || ((x + off) & 7) === 0) {
            col = packRGBA(182, 182, 186);
          } else {
            col = packRGBA(168 + v, 42 + (v >> 1), 36 + (v >> 1));
          }
          break;
        }
        case E.STONE:
          col = packRGBA(118 + v, 122 + v, 128 + v);
          break;
        case E.METAL: {
          const rivet = (x % 6 === 1 && y % 6 === 1) ? -32 : ((x % 6 === 0 || y % 6 === 0) ? 18 : 0);
          const m = Math.max(40, Math.min(240, 145 + rivet + (v >> 1)));
          const hot = Math.min(110, Math.max(0, (temp[i] - 300) * 0.12)) | 0;
          col = packRGBA(Math.min(255, m + hot), Math.max(30, m - (hot >> 2)), Math.max(30, m - (hot >> 1)));
          break;
        }
        case E.WOOD: {
          const gr = (((y + ((x >> 3) & 1)) & 3) === 0) ? -18 : 8;
          col = packRGBA(130 + gr + (v >> 1), 76 + gr, 38 + (v >> 1));
          break;
        }
        case E.GLASS: {
          const gl = ((x - y) & 15) === 0 ? 75 : 0;
          col = packRGBA(110 + gl, 175 + (gl >> 1), 215 + (gl >> 2));
          break;
        }
        case E.FIRE: {
          const life = meta[i];
          if (life > 30) col = packRGBA(255, 240, 90);
          else if (life > 16) col = packRGBA(255, 130 + (life * 4), 10);
          else col = packRGBA(210 + (life * 2), 35 + life * 3, 5);
          break;
        }
        case E.LAVA: {
          const fl = ((s + frame * 2) & 31);
          col = packRGBA(255, 55 + fl * 3, fl > 22 ? 40 : 0);
          break;
        }
        case E.PLASMA: {
          const p = (s + frame * 7) & 63;
          col = packRGBA(210 + (p >> 1), 70 + p * 2, 255);
          break;
        }
        case E.PLANT:
          col = packRGBA(22 + (s & 15), 185 + v * 2, 28 + (s & 15));
          break;
        case E.ALGAE:
          col = packRGBA(16, 145 + v * 2, 55 + (s & 31));
          break;
        case E.SEED:
          col = packRGBA(175 + v, 118 + v, 42);
          break;
        case E.GUNPOWDER:
          col = packRGBA(64 + v, 66 + v, 72 + v);
          break;
        case E.TNT: {
          const band = (y % 7 === 3 || y % 7 === 4);
          col = band ? packRGBA(240, 240, 240) : packRGBA(210 + v, 32, 32);
          break;
        }
        case E.C4:
          col = packRGBA(102 + v, 128 + v, 58 + (v >> 1));
          break;
        case E.FUSE:
          col = packRGBA(155 + v, 112 + v, 68);
          break;
        case E.ACID:
          col = packRGBA(70 + (s & 31), 240 + (s & 15), 25);
          break;
        case E.GAS:
          col = packRGBA(190, 185, 75);
          break;
        case E.STEAM:
          col = packRGBA(195 + (s & 31), 215 + (s & 31), 232);
          break;
        case E.SMOKE: {
          const k = Math.min(130, 55 + (meta[i] >> 1));
          col = packRGBA(k, k, k + 5);
          break;
        }
        case E.TOXIC:
          col = packRGBA(65, 200 + (s & 31), 90);
          break;
        case E.CONCRETE:
          col = packRGBA(145 + v, 148 + v, 152 + v);
          break;
        case E.DIRT:
          col = packRGBA(112 + v, 74 + v, 42 + (v >> 1));
          break;
        case E.SAWDUST:
          col = packRGBA(205 + v, 152 + v, 78 + (v >> 1));
          break;
        case E.ASH:
          col = packRGBA(100 + v, 102 + v, 108 + v);
          break;
        case E.SULFUR:
          col = packRGBA(238 + (s & 15), 218 + v, 24);
          break;
        case E.MERCURY: {
          const m = 195 + ((s + frame * 3) & 31);
          col = packRGBA(m, m + 5, m + 14);
          break;
        }
        case E.NITROGEN:
          col = packRGBA(115, 215 + (s & 31), 255);
          break;
        case E.NITRO:
          col = packRGBA(28, 210 + v, 128 + v);
          break;
        case E.THERMITE:
          col = temp[i] > 450 ? packRGBA(255, 255, 220) : packRGBA(166 + v, 78 + v, 36);
          break;
        case E.URANIUM: {
          const g = 180 + ((s + frame * 4) & 63);
          col = packRGBA(50, Math.min(255, g), 65);

        }
        case E.VIRUS:
          col = packRGBA(175 + v, 48, 220 + (s & 31));

        case E.ANT:

          break;
        case E.FISH:
          col = packRGBA(255, 130 + (s & 31), 30);
          break;
        case E.SPONGE: {
          const wet = meta[i] * 5;
          const hole = ((x + y) & 3) === 0 ? -28 : 0;
          col = packRGBA(Math.max(40, 232 + hole - wet), Math.max(40, 200 + hole - (wet >> 1)), Math.min(240, 42 + wet * 2));

        }
        case E.VOID:
          col = ((x + y + frame) & 3) === 0 ? packRGBA(130, 45, 180) : packRGBA(18, 12, 26);
          break;
        case E.CLONE:
          col = ((x ^ y) & 2) ? packRGBA(236, 72, 153) : packRGBA(250, 204, 21);
          break;
        case E.BATTERY:
          col = (y & 2) ? packRGBA(250, 204, 21) : packRGBA(34, 197, 94);
          break;
        case E.WIRE:
          col = elec[i] === 2 ? packRGBA(255, 180, 60) : packRGBA(175, 92, 42);
          break;
        case E.HEATER:
          col = meta[i] > 0 ? packRGBA(255, 85, 30) : packRGBA(120, 45, 45);
          break;
        case E.COOLER:
          col = meta[i] > 0 ? packRGBA(70, 220, 255) : packRGBA(42, 85, 120);
          break;
        case E.LED:
          col = meta[i] > 0 ? packRGBA(255, 255, 110) : packRGBA(85, 85, 65);
          break;
        case E.FAN:
          col = (((x + y + (meta[i] > 0 ? frame * 2 : frame)) & 3) === 0) ? packRGBA(56, 189, 248) : packRGBA(71, 85, 105);
          break;
        case E.VOLCANO:
          col = ((x + y) & 3) === 0 ? packRGBA(220, 50, 20) : packRGBA(85, 55, 50);
          break;
        case E.FIREWORK:
          col = packRGBA(255, 90, 170);
          break;
        case E.FOAM:
          col = packRGBA(240 + (s & 15), 245 + (s & 10), 255);
          break;
        case E.CLOUD: col = packRGBA(195+(s&31),205+(s&31),220+(s&31)); break;
        case E.RAIN: col = packRGBA(45,150+(s&31),245); break;
        case E.OXYGEN: col = ((x+y+frame)&3)===0 ? packRGBA(185,235,255) : packRGBA(120,195,235); break;
        case E.MOSS: col = packRGBA(55+(s&15),125+(s&31),45); break;
        case E.WAX: col = packRGBA(245,205+(s&25),55); break;
        case E.RUBBER: col = packRGBA(45+(s&12),52+(s&12),64+(s&12)); break;
        case E.CERAMIC: col = packRGBA(220+(s&20),175+(s&20),155+(s&20)); break;
        case E.OBSIDIAN: col = ((x+y)&3)===0 ? packRGBA(105,65,160) : packRGBA(43,24,73); break;
        case E.CORAL: col = packRGBA(245,95+(s&31),120+(s&31)); break;
        case E.HONEY: col = packRGBA(235+(s&16),155+(s&25),12); break;
        case E.MUD: col = packRGBA(92+(s&13),61+(s&11),38); break;
        case E.COPPER: col = packRGBA(185+(s&25),92+(s&17),48); break;
        case E.COAL: col = packRGBA(42+(s&12),44+(s&12),49+(s&12)); break;
        case E.CHARCOAL: col = packRGBA(29+(s&10),30+(s&10),34+(s&10)); break;
        case E.BUBBLE: col = ((x+y+frame)&3)===0 ? packRGBA(225,250,255) : packRGBA(120,205,235); break;
        case E.SALTPETER: col = packRGBA(224+(s&20),218+(s&18),185+(s&20)); break;
        case E.STEEL: col = packRGBA(105+(s&25),126+(s&25),145+(s&25)); break;
        case E.MAGNET: col = ((x&7)<3) ? packRGBA(220,45,55) : packRGBA(225,230,235); break;
        case E.CLAY: col = packRGBA(155+(s&18),91+(s&15),65+(s&12)); break;
        case E.GRAVEL: col = packRGBA(112+(s&35),119+(s&35),126+(s&35)); break;
        case E.GOLD: col = packRGBA(235+(s&20),174+(s&30),26); break;
        case E.DIAMOND: col = ((x+y)&3)===0?packRGBA(230,255,255):packRGBA(95,205,220); break;
        case E.RUST: col = packRGBA(145+(s&30),70+(s&20),36+(s&15)); break;
        case E.LYE: col = packRGBA(145+(s&18),170+(s&20),108+(s&18)); break;
        case E.SOAP: col = packRGBA(240+(s&15),125+(s&24),180+(s&22)); break;
        case E.SYRUP: col = packRGBA(198+(s&25),115+(s&20),18); break;
        case E.ALCOHOL: col = packRGBA(120+(s&20),190+(s&25),245); break;
        case E.CUPRITES: col = packRGBA(55+(s&20),54+(s&18),62+(s&22)); break;
        default:
          col = packRGBA(200, 200, 200);
      }
      buf32[i] = col;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function renderHeatVision() {
  for (let i = 0; i < N; i++) {
    const t = temp[i];
    let r, g, b;
    if (t < 0) {
      const k = Math.max(0, Math.min(1, -t / 180));
      r = (20 * k) | 0; g = (80 + 160 * k) | 0; b = 255;
    } else if (t < 80) {
      const k = t / 80;
      r = (10 + k * 20) | 0; g = (15 + k * 90) | 0; b = (60 + k * 140) | 0;
    } else if (t < 350) {
      const k = (t - 80) / 270;
      r = (30 + k * 215) | 0; g = (105 + k * 140) | 0; b = (200 - k * 190) | 0;
    } else if (t < 1100) {
      const k = (t - 350) / 750;
      r = 255; g = (245 - k * 185) | 0; b = (10 + k * 20) | 0;
    } else {
      const k = Math.min(1, (t - 1100) / 1400);
      r = 255; g = (60 + k * 195) | 0; b = (30 + k * 225) | 0;
    }
    // Slight outline for solid matter
    if (grid[i] !== E.EMPTY && t > 15 && t < 40) { r += 16; g += 18; b += 22; }
    buf32[i] = packRGBA(Math.min(255,r), Math.min(255,g), Math.min(255,b));
  }
}

/* ==================== DRAWING & TOUCH / PINCH-ZOOM ==================== */
let selectedId = E.SAND;
let mixMode = false;
let brushSize = 5;
let brushMode = 'circle'; // circle, spray, line, fill
let zoom = 1, panX = 0, panY = 0;

function applyViewTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  document.getElementById('btnResetZoom').style.display = zoom > 1.02 ? 'block' : 'none';
}

function screenToGrid(clientX, clientY) {
  const rect = stageWrap.getBoundingClientRect();
  const lx = (clientX - rect.left - panX) / zoom;
  const ly = (clientY - rect.top - panY) / zoom;
  return {
    gx: Math.floor((lx / rect.width) * W),
    gy: Math.floor((ly / rect.height) * H)
  };
}

function paintBrush(cx, cy) {
  const r = brushSize;
  const r2 = r * r;
  const spray = brushMode === 'spray';
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r2) continue;
      const x = cx + dx;
      if (x < 0 || x >= W) continue;
      if (spray && Math.random() > 0.25) continue;
      // Natural scatter for powders/liquids when brush > 2
      if (!spray && r >= 2 && (POWDER[selectedId] || GAS_T[selectedId]) && Math.random() > 0.65) continue;

      const idx = y * W + x;
      if (selectedId === E.TOOL_HEAT) { temp[idx] = Math.min(3500, temp[idx] + 220); continue; }
      if (selectedId === E.TOOL_COOL) { temp[idx] = Math.max(-220, temp[idx] - 180); continue; }
      if (selectedId === E.TOOL_SPARK) {
        SFX.zap();
        if (conductiveAt(idx)) elec[idx] = 1;
        else if (grid[idx] === E.EMPTY) { setCell(idx, E.FIRE, 10); temp[idx] = 900; }
        else temp[idx] += 450;
        continue;
      }
      if (selectedId === E.EMPTY) {
        setCell(idx, E.EMPTY);
      } else {
        const cur = grid[idx];
        if (mixMode && selectedId < 100 && cur !== E.EMPTY) {
          combineAt(idx, selectedId);
        } else if (cur === E.EMPTY || overwriteSolid || (!SOLID[cur] && SOLID[selectedId])) {
          setCell(idx, selectedId);
        }
      }
    }
  }
}

function paintLine(x0, y0, x1, y1) {
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  while (true) {
    paintBrush(x0, y0);
    if (x0 === x1 && y0 === y1) break;
    const e2 = err * 2;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx)  { err += dx; y0 += sy; }
  }
}

function floodFill(sx, sy) {
  if (sx < 0 || sx >= W || sy < 0 || sy >= H) return;
  if (selectedId >= 100) { paintBrush(sx, sy); return; }
  const target = grid[sy * W + sx];
  if (target === selectedId) return;
  const q = [sy * W + sx];
  const seen = new Uint8Array(N);
  seen[q[0]] = 1;
  let count = 0;
  while (q.length && count < 18000) {
    const i = q.pop();
    setCell(i, selectedId);
    count++;
    const x = i % W, y = (i / W) | 0;
    if (x > 0 && !seen[i-1] && grid[i-1] === target) { seen[i-1]=1; q.push(i-1); }
    if (x < W-1 && !seen[i+1] && grid[i+1] === target) { seen[i+1]=1; q.push(i+1); }
    if (y > 0 && !seen[i-W] && grid[i-W] === target) { seen[i-W]=1; q.push(i-W); }
    if (y < H-1 && !seen[i+W] && grid[i+W] === target) { seen[i+W]=1; q.push(i+W); }
  }
}

// Pointer / Multi-touch handling
const pointers = new Map();
let isDrawing = false;
let lastG = null;
let lineStart = null, lineCur = null;
let pinchStartDist = 0, pinchStartZoom = 1, pinchMid = null, panStart = null;

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect=stageWrap.getBoundingClientRect(), px=e.clientX-rect.left, py=e.clientY-rect.top;
  const gx=(px-panX)/zoom, gy=(py-panY)/zoom;
  zoom=Math.max(1,Math.min(4,zoom*(e.deltaY<0?1.12:0.89)));
  panX=px-gx*zoom; panY=py-gy*zoom; clampPan(); applyViewTransform();
},{passive:false});
window.addEventListener('keydown', e => {
  if (e.code==='Space' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||'')) { e.preventDefault(); document.getElementById('btnPlay').click(); }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z') { e.preventDefault(); doUndo(); }
});

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  SFX.unlock();
  startMotionSensor();
  closePopovers();
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 2) {
    isDrawing = false;
    lineStart = null;
    clearOverlay();
    const [p1, p2] = [...pointers.values()];
    pinchStartDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    pinchStartZoom = zoom;
    pinchMid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    panStart = { x: panX, y: panY };
    return;
  }

  const g = screenToGrid(e.clientX, e.clientY);
  updateTempReadout(g.gx, g.gy);
  pushUndo();

  if (brushMode === 'fill') {
    floodFill(g.gx, g.gy);
    return;
  }
  if (brushMode === 'line') {
    lineStart = g; lineCur = g;
    drawLineOverlay();
    return;
  }
  isDrawing = true;
  lastG = g;
  paintBrush(g.gx, g.gy);
});

canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  e.preventDefault();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 2) {
    const [p1, p2] = [...pointers.values()];
    const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
    const rect = stageWrap.getBoundingClientRect();
    const newZoom = Math.max(1, Math.min(4, pinchStartZoom * (dist / Math.max(10, pinchStartDist))));
    const ratio = newZoom / pinchStartZoom;
    panX = (midX - rect.left) - ((pinchMid.x - rect.left) - panStart.x) * ratio;
    panY = (midY - rect.top)  - ((pinchMid.y - rect.top)  - panStart.y) * ratio;
    zoom = newZoom;
    clampPan();
    applyViewTransform();
    return;
  }

  const g = screenToGrid(e.clientX, e.clientY);
  updateTempReadout(g.gx, g.gy);
  if (brushMode === 'line' && lineStart) {
    lineCur = g;
    drawLineOverlay();
    return;
  }
  if (isDrawing && lastG) {
    paintLine(lastG.gx, lastG.gy, g.gx, g.gy);
    lastG = g;
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (brushMode === 'line' && lineStart && lineCur) {
    paintLine(lineStart.gx, lineStart.gy, lineCur.gx, lineCur.gy);
    lineStart = null; lineCur = null;
    clearOverlay();
  }
  if (pointers.size < 1) { isDrawing = false; lastG = null; }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

function clampPan() {
  const rect = stageWrap.getBoundingClientRect();
  const minX = rect.width * (1 - zoom), minY = rect.height * (1 - zoom);
  panX = Math.min(0, Math.max(minX, panX));
  panY = Math.min(0, Math.max(minY, panY));
}

function clearOverlay() { oCtx.clearRect(0, 0, oCanvas.width, oCanvas.height); }
function drawLineOverlay() {
  clearOverlay();
  if (!lineStart || !lineCur) return;
  const rect = stageWrap.getBoundingClientRect();
  const sx = (lineStart.gx / W) * rect.width * zoom + panX;
  const sy = (lineStart.gy / H) * rect.height * zoom + panY;
  const ex = (lineCur.gx / W) * rect.width * zoom + panX;
  const ey = (lineCur.gy / H) * rect.height * zoom + panY;
  oCtx.strokeStyle = 'rgba(255,255,255,0.85)';
  oCtx.lineWidth = Math.max(2, (brushSize * 2 / W) * rect.width * zoom);
  oCtx.lineCap = 'round';
  oCtx.setLineDash([6, 6]);
  oCtx.beginPath(); oCtx.moveTo(sx, sy); oCtx.lineTo(ex, ey); oCtx.stroke();
  oCtx.setLineDash([]);
}

function updateTempReadout(gx, gy) {
  if (gx >= 0 && gx < W && gy >= 0 && gy < H) {
    document.getElementById('hudTemp').textContent = Math.round(temp[gy * W + gx]) + '°C';
  }
}

/* ==================== PRESET SCENES & SAVE SLOTS ==================== */
function clearGrid() {
  grid.fill(E.EMPTY); temp.fill(22); meta.fill(0); elec.fill(0); mixA.fill(0); mixB.fill(0); mixRatio.fill(0);
}

function drawRect(x0, y0, x1, y1, id, m) {
  for (let y = Math.max(0, y0); y <= Math.min(H - 1, y1); y++)
    for (let x = Math.max(0, x0); x <= Math.min(W - 1, x1); x++)
      setCell(y * W + x, id, m);
}

function loadPreset(name) {
  pushUndo();
  clearGrid();
  if (name === 'classic') {
    // Recreates the iconic SmellyMoo screenshot 1-to-1!
    const cx = (W * 0.62) | 0, cy = (H * 0.28) | 0, bw = (W * 0.34) | 0, bh = (H * 0.32) | 0;
    // Brick bucket
    drawRect(cx - bw/2 | 0, cy, (cx - bw/2 | 0) + 4, cy + bh, E.BRICK);
    drawRect((cx + bw/2 | 0) - 4, cy - 10, cx + bw/2 | 0, cy + bh, E.BRICK);
    drawRect(cx - bw/2 | 0, cy + bh - 5, cx + bw/2 | 0, cy + bh, E.BRICK);
    // Metal cup on top-left of bucket
    drawRect(cx - bw/2 | 0, cy - 18, (cx - bw/2 | 0) + 22, cy - 14, E.METAL);
    drawRect(cx - bw/2 | 0, cy - 28, (cx - bw/2 | 0) + 4, cy - 14, E.METAL);
    drawRect((cx - bw/2 | 0) + 18, cy - 28, (cx - bw/2 | 0) + 22, cy - 14, E.METAL);
    // Oil + Salt inside bucket
    drawRect((cx - bw/2 | 0) + 5, cy + (bh * 0.45 | 0), (cx + bw/2 | 0) - 5, cy + bh - 6, E.OIL);
    // 4 Spouts at top (Sand, Water, Oil, Salt)
    drawRect((W * 0.25) | 0, 2, ((W * 0.25) | 0) + 2, 4, E.CLONE, E.SAND);
    drawRect((W * 0.41) | 0, 2, ((W * 0.41) | 0) + 2, 4, E.CLONE, E.WATER);
    drawRect((cx - bw/2 | 0) + 10, 2, (cx - bw/2 | 0) + 12, 4, E.CLONE, E.OIL);
    drawRect((cx + 8) | 0, 2, (cx + 10) | 0, 4, E.CLONE, E.SALT);
    // Pre-seed floor pile of water, sand & growing plant
    drawRect((W * 0.3) | 0, H - 18, W - 2, H - 1, E.WATER);
    drawRect((W * 0.62) | 0, H - 12, (W * 0.67) | 0, H - 1, E.DIRT);
    drawRect((W * 0.64) | 0, H - 22, (W * 0.65) | 0, H - 13, E.PLANT);
    // Small fire spark on oil surface
    drawRect((cx - 8) | 0, cy + (bh * 0.42 | 0), (cx - 4) | 0, cy + (bh * 0.44 | 0), E.FIRE);
    showToast('🧱 Загружена классика sand:box!');
  } else if (name === 'volcano') {
    const mx = W >> 1;
    for (let y = (H * 0.42) | 0; y < H; y++) {
      const span = Math.floor((y - H * 0.42) * 0.65) + 6;
      drawRect(mx - span, y, mx + span, y, E.STONE);
    }
    drawRect(mx - 4, (H * 0.42) | 0, mx + 4, (H * 0.68) | 0, E.EMPTY);
    drawRect(mx - 4, (H * 0.66) | 0, mx + 4, (H * 0.72) | 0, E.VOLCANO);
    drawRect(2, H - 28, mx - 38, H - 1, E.WATER);
    drawRect(mx + 38, H - 28, W - 3, H - 1, E.WATER);
    showToast('🌋 Вулкан готов к извержению!');
  } else if (name === 'bomb') {
    const yMid = (H * 0.65) | 0;
    drawRect(12, yMid + 14, W - 12, yMid + 20, E.BRICK);
    drawRect((W * 0.65) | 0, yMid - 14, (W * 0.8) | 0, yMid + 13, E.C4);
    drawRect((W * 0.5) | 0, yMid - 8, (W * 0.62) | 0, yMid + 13, E.TNT);
    drawRect((W * 0.16) | 0, yMid + 5, (W * 0.65) | 0, yMid + 7, E.WIRE);
    drawRect((W * 0.14) | 0, yMid - 12, (W * 0.24) | 0, yMid - 6, E.GLASS);
    showToast('💣 Поставь Батарею на левый край провода!');
  } else if (name === 'lab') {
    const x1 = (W * 0.22) | 0, x2 = (W * 0.78) | 0, y1 = (H * 0.35) | 0, y2 = (H * 0.72) | 0;
    // Glass flask holding acid over metal grate & bricks
    drawRect(x1, y1, x1 + 3, y2, E.GLASS);
    drawRect(x2 - 3, y1, x2, y2, E.GLASS);
    drawRect(x1, y2 - 3, x2, y2, E.METAL);
    drawRect(x1 + 4, y1 + 14, x2 - 4, y2 - 4, E.ACID);
    drawRect(10, H - 22, W - 10, H - 16, E.BRICK);
    showToast('🧪 Кислота уже разъедает металлическое дно!');
  }
  closePopovers();
}

function renderSaveSlots() {
  const el = document.getElementById('saveSlots');
  el.innerHTML = [1, 2, 3].map(slot => {
    const has = !!localStorage.getItem('sandbox_slot_' + slot);
    return `<div class="row" style="background:rgba(255,255,255,0.05);padding:7px 10px;border-radius:10px">
      <span style="font-size:12px;font-weight:700">Слот #${slot} ${has ? '✓' : '(пусто)'}</span>
      <div style="display:flex;gap:6px">
        <button class="seg-btn" data-save="${slot}" style="padding:5px 10px">Сохранить</button>
        <button class="seg-btn" data-load="${slot}" ${has ? '' : 'disabled'} style="padding:5px 10px${has ? '' : ';opacity:0.4'}">Загрузить</button>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('[data-save]').forEach(b => b.onclick = () => {
    const s = b.dataset.save;
    try {
      const payload = { w:W, h:H, g:Array.from(grid), m:Array.from(meta), ma:Array.from(mixA), mb:Array.from(mixB), mr:Array.from(mixRatio) };
      localStorage.setItem('sandbox_slot_' + s, JSON.stringify(payload));
      showToast(`💾 Сохранено в Слот #${s}`);
      renderSaveSlots();
    } catch { showToast('Не удалось сохранить'); }
  });

  el.querySelectorAll('[data-load]').forEach(b => b.onclick = () => {
    const s = b.dataset.load;
    try {
      const raw = localStorage.getItem('sandbox_slot_' + s);
      if (!raw) return;
      const d = JSON.parse(raw);
      pushUndo(); clearGrid();
      const mw = Math.min(W, d.w), mh = Math.min(H, d.h);
      for (let y = 0; y < mh; y++)
        for (let x = 0; x < mw; x++) {
          const si = y * d.w + x, di = y * W + x;
          if (d.g[si]) { setCell(di,d.g[si],d.m[si]); if(d.g[si]===E.MIX){mixA[di]=d.ma?.[si]||0;mixB[di]=d.mb?.[si]||0;mixRatio[di]=d.mr?.[si]||127;} }
        }
      showToast(`📂 Загружен Слот #${s}`);
      closePopovers();
    } catch { showToast('Ошибка загрузки'); }
  });
}

/* ==================== PALETTE & UI WIRING ==================== */
let activeCat = 'all';

function renderPalette() {
  const g = document.getElementById('paletteGrid');
  const list = activeCat === 'all' ? PALETTE : PALETTE.filter(p => p.cat === activeCat);
  g.innerHTML = list.map(p => `
    <div class="el-tile ${p.id === selectedId ? 'selected' : ''}" data-el="${p.id}" style="background:${p.tile}">
      ${tileIcon(p.ico)}
      <span class="t-name">${p.name}</span>
    </div>`).join('');

  g.querySelectorAll('.el-tile').forEach(tile => {
    tile.onclick = () => {
      SFX.unlock();
      selectedId = +tile.dataset.el;
      updateSelectedHUD();
      g.querySelectorAll('.el-tile').forEach(t => t.classList.toggle('selected', +t.dataset.el === selectedId));
    };
  });
}

function updateSelectedHUD() {
  const p = PALETTE_MAP[selectedId];
  if (!p) return;
  document.getElementById('hudName').textContent = p.name;
  document.getElementById('hudDesc').textContent = p.desc;
  document.getElementById('hudSwatch').style.background = p.sw;
}

document.querySelectorAll('.cat-chip').forEach(ch => ch.onclick = () => {
  activeCat = ch.dataset.cat;
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.toggle('active', c === ch));
  document.getElementById('paletteWrap').scrollLeft = 0;
  renderPalette();
});

// Top bar buttons
document.getElementById('btnPlay').onclick = function() {
  paused = !paused;
  this.innerHTML = paused ? '▶ <span class="lbl">Старт</span>' : '⏸ <span class="lbl">Пауза</span>';

document.getElementById('btnSpeed').onclick = function() {

  this.innerHTML = `⏩<span>${speed}× скорость</span>`;
  this.classList.toggle('active', speed > 1);

document.getElementById('btnLine').onclick = function() {
  brushMode = brushMode === 'line' ? 'circle' : 'line';
  syncBrushModeUI();
};

document.getElementById('btnHeat').onclick = function() {
  heatVision = !heatVision;
  this.classList.toggle('heat-on', heatVision);
  this.classList.toggle('active', heatVision);
  showToast(heatVision ? '🌡 Тепловизор ВКЛ' : '🌡 Обычный вид');

document.getElementById('btnUndo').onclick = doUndo;

document.getElementById('btnSound').onclick = function() {
  SFX.on = !SFX.on;
  this.innerHTML = `${SFX.on ? '🔊' : '🔇'}<span>Звук: ${SFX.on ? 'вкл' : 'выкл'}</span>`;
};

let clearConfirm = 0;
document.getElementById('btnClear').onclick = () => {
  const now = performance.now();
  if (now - clearConfirm < 2000) {
    pushUndo();
    clearGrid();
    showToast('🧹 Холст очищен');
    clearConfirm = 0;
  } else {
    clearConfirm = now;
    showToast('Нажми 🗑 ещё раз для очистки');
  }
};

document.getElementById('btnResetZoom').onclick = () => {
  zoom = 1; panX = 0; panY = 0; applyViewTransform();
};

function closePopovers() {
  document.querySelectorAll('.popover').forEach(p => p.classList.remove('open'));
}
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closePopovers);

document.getElementById('btnMenu').onclick = () => {

document.getElementById('btnScenes').onclick = () => {

function syncBrushModeUI() {
  document.getElementById('btnLine').classList.toggle('active', brushMode === 'line');
}

function orientationGravity() {
  const angle = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  const norm = ((angle % 360) + 360) % 360;
  gravityDir = (norm >= 45 && norm < 135) ? -2 : (norm >= 225 && norm < 315) ? 2 : 1;
}
let motionAccessRequested = false;
let motionSensorReady = false;
function applyDeviceMotion(e) {
  const a=e.accelerationIncludingGravity;
  if(!a || a.x==null || a.y==null) return;
  const angle0=(screen.orientation && typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0);
  const angle=((angle0%360)+360)%360;
  let gx,gy;
  // iOS Safari's accelerometer axes are reversed on X/Y; rotate the raw
  // sensor vector into the currently visible screen axes (portrait/landscape).
  if(angle<45 || angle>=315) { gx=-a.x; gy=a.y; }             // portrait
  else if(angle>=45 && angle<135) { gx=a.y; gy=a.x; }         // landscape clockwise
  else if(angle>=135 && angle<225) { gx=-a.y; gy=-a.x; }      // upside-down portrait
  else { gx=a.x; gy=-a.y; }                                   // landscape counter-clockwise
  if(Math.abs(gx)>4.0 && Math.abs(gx)>Math.abs(gy)*1.04) gravityDir=gx>0?2:-2;
  else if(Math.abs(gy)>4.0) gravityDir=gy>0?1:-1;
}
function applyDeviceTilt(e) {
  if (e.beta==null || e.gamma==null) return;
  const angle0=(screen.orientation && typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0);
  const angle=((angle0%360)+360)%360;
  let gx=Math.sin(e.gamma*Math.PI/180), gy=Math.sin(e.beta*Math.PI/180);
  if(angle>=45&&angle<135){const t=gx;gx=gy;gy=-t;}
  else if(angle>=135&&angle<225){gx=-gx;gy=-gy;}
  else if(angle>=225&&angle<315){const t=gx;gx=-gy;gy=t;}
  gx=-gx;
  if(Math.abs(gx)>0.58&&Math.abs(gx)>Math.abs(gy)*0.88)gravityDir=gx>0?2:-2;
  else if(Math.abs(gy)>0.58)gravityDir=gy>0?1:-1;
}
function startMotionSensor() {
  if (motionSensorReady) { showToast('📱 Наклон уже включён'); return; }
  const DM=window.DeviceMotionEvent, DO=window.DeviceOrientationEvent;
  const attachMotion=()=>{
    window.addEventListener('devicemotion',applyDeviceMotion,{passive:true});
    motionSensorReady=true; motionAccessRequested=true;
    const b=document.getElementById('btnTilt');if(b){b.classList.add('active');b.innerHTML='📱<span>Наклон включён</span>';}
    showToast('📱 Наклон включён — проверь влево и вправо');
  };
  const attachOrientationFallback=()=>{
    window.addEventListener('deviceorientation',applyDeviceTilt,{passive:true});
    motionSensorReady=true; motionAccessRequested=true;
    const b=document.getElementById('btnTilt');if(b){b.classList.add('active');b.innerHTML='📱<span>Наклон включён</span>';}
    showToast('📱 Наклон включён');
  };
  if(DM && typeof DM.requestPermission==='function') {
    try {
      DM.requestPermission().then(state=>{
        if(state==='granted') attachMotion();
        else {motionAccessRequested=false;showToast('iPhone отклонил доступ к датчику движения');}
      }).catch(()=>{motionAccessRequested=false;showToast('Нажми ещё раз в Safari и разреши датчик движения');});
    } catch(err) {motionAccessRequested=false;showToast('Открой игру в Safari и запроси наклон ещё раз');}
    return;
  }
  if(DM) {attachMotion();return;}
  if(DO && typeof DO.requestPermission==='function') {
    try { DO.requestPermission().then(state=>state==='granted'?attachOrientationFallback():showToast('Разреши наклон в Safari')).catch(()=>showToast('Не удалось запросить наклон')); }
    catch(err) {showToast('Открой игру напрямую в Safari');}
    return;
  }
  if(DO) attachOrientationFallback();
  else showToast('Браузер не поддерживает датчик наклона');
}
document.getElementById('btnTilt').onclick = startMotionSensor;
document.getElementById('btnMix').onclick = function() {
  mixMode=!mixMode;
  this.classList.toggle('active',mixMode);
  this.innerHTML=mixMode?'⚗️<span>Смешивание: вкл</span>':'⚗️<span>Смешивание: выкл</span>';
  showToast(mixMode?'Выбери материал и рисуй поверх другого':'Режим смешивания выключен');
};
function onViewportChange() {
  const rect = stageWrap.getBoundingClientRect();
  // Keep the simulation grid and all drawn pixels exactly the same size on rotation.
  // Only the transparent overlay follows the viewport; gravity can still track orientation.
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  oCanvas.width = Math.round(rect.width*dpr); oCanvas.height = Math.round(rect.height*dpr);
  oCtx.setTransform(dpr,0,0,dpr,0,0);
  if (!motionSensorReady) orientationGravity();
  clampPan(); applyViewTransform();
}
window.addEventListener('resize', onViewportChange, {passive:true});
window.addEventListener('orientationchange', () => setTimeout(onViewportChange,120), {passive:true});
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', onViewportChange);

document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => loadPreset(b.dataset.preset));

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ==================== MAIN LOOP ==================== */
function loop() {
  if (!paused) {
    for (let s = 0; s < speed; s++) stepSim();
  }
  renderSim();
  requestAnimationFrame(loop);
}

initDimensions();
orientationGravity();
renderPalette();
updateSelectedHUD();
clearGrid(); // Start with a completely empty canvas; scenes are optional.
requestAnimationFrame(loop);
})();
</script>
